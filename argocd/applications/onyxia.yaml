apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: onyxia
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/AdamRosing/onyxia-ops.git
    targetRevision: main
    path: apps/onyxia

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: onyxia

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true